name: Bug report
description: Something didn't work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please **redact anything personal** before pasting. Designs,
        room photos, client names and addresses are all private. Replace them
        with placeholders, or use the invented names Alex, Sam, Dave and
        Mateo, the place Fairhaven, and the companies AcmeCo, Initech and
        Globex. Error text, dimensions in millimetres and which step you were
        on are the useful bits.

        Security problem? Don't open an issue, see [SECURITY.md](https://github.com/shawn-durrani/woodchuck/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Plain words are perfect. "I asked Claude to make the shelf 100 mm deeper and the cut list didn't change" is a great report.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Open a design on http://127.0.0.1:8905
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The design view or its plan views
        - The chat with Claude
        - Checks or the cut list
        - Photo placement or the AI blend
        - Starred or saved designs
        - Starting, building or running the app
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The tag or `git rev-parse --short HEAD` output.
  - type: textarea
    id: tests
    attributes:
      label: Keyless test output (if you can run it)
      description: "Run `npm run typecheck`, `npm test` and `python -m pytest tests/ -q` with no API keys set. Paste the last few lines of whichever one fails."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Designs are saved in `data/` on your own computer. Nothing from there belongs in a public issue.
      options:
        - label: I've redacted real names, designs, photos and personal content from this report.
          required: true
